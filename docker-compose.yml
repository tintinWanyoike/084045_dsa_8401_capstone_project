# Start:  docker compose up --build        Stop: docker compose down
services:
  api:
    build: .
    image: dormancy-api:1.0.0
    container_name: dormancy-api
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
